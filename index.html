<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
CONTROL OPERATIVO GRÚAS
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ================= ROOT ================= */

:root{

--bg:#cfd6dd;

--panel:#edf1f4;

--border:#aab4bf;

--text:#1f2933;

--muted:#596673;

--green-bg:#7f9d73;
--green-text:#13210f;

--blue-bg:#6e8397;
--blue-text:#0f1b26;

--red-bg:#9b6d6d;
--red-text:#2d0e0e;

--yellow-bg:#9f8f63;
--yellow-text:#2f2610;

--gray-bg:#7f8a95;
--gray-text:#111827;

--purple-bg:#80718f;
--purple-text:#1d1328;

}

/* ================= BODY ================= */

body{

background:var(--bg);

font-family:
Arial,
Helvetica,
sans-serif;

color:var(--text);

min-height:100vh;

}

/* ================= HEADER ================= */

.header{

background:#b8c2cc;

border-bottom:
2px solid #8d98a3;

display:flex;

justify-content:space-between;

align-items:center;

padding:14px 18px;

position:sticky;

top:0;

z-index:1000;

}

.title{

font-size:20px;

font-weight:700;

letter-spacing:1px;

}

.right{

display:flex;

gap:10px;

align-items:center;

}

.search,
.filter{

height:38px;

border:
1px solid #8f9aa5;

background:#eef1f4;

padding:0 10px;

font-size:12px;

outline:none;

}

.clock{

font-size:12px;

font-weight:700;

}

/* ================= KPIS ================= */

.kpis{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:12px;

padding:16px;

}

.kpi{

background:var(--panel);

border:
1px solid var(--border);

padding:14px;

}

.kpi-title{

font-size:11px;

color:var(--muted);

}

.kpi-value{

margin-top:8px;

font-size:28px;

font-weight:700;

}

/* ================= DASHBOARD ================= */

.dashboard{

display:grid;

grid-template-columns:
1fr 340px;

gap:16px;

padding:0 16px 16px;

}

/* ================= YARD ================= */

.yard{

background:var(--panel);

border:
1px solid var(--border);

padding:14px;

overflow:auto;

}

.row{

display:flex;

align-items:flex-start;

margin-bottom:16px;

}

.zona{

width:90px;

padding-top:18px;

font-size:12px;

font-weight:700;

color:var(--muted);

}

/* ================= GRID ================= */

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(70px,1fr));

gap:8px;

width:100%;

}

/* ================= CARD ================= */

.card{

width:100%;

min-width:70px;

height:72px;

display:flex;

flex-direction:column;

justify-content:center;
align-items:center;

position:relative;

cursor:pointer;

border:
1px solid rgba(0,0,0,.25);

}

.card:hover{

filter:brightness(.96);

}

/* ================= ESTADOS ================= */

.operacion{
background:var(--green-bg);
color:var(--green-text);
}

.disponible{
background:var(--blue-bg);
color:var(--blue-text);
}

.falla{
background:var(--red-bg);
color:var(--red-text);
}

.banio{
background:var(--yellow-bg);
color:var(--yellow-text);
}

.anclada{
background:var(--gray-bg);
color:var(--gray-text);
}

.sinsenal{
background:var(--purple-bg);
color:var(--purple-text);
}

.empty{

background:#d9e0e6;

border:
1px dashed #9aa6b2;

}

/* ================= CARD TEXT ================= */

.code{

font-size:16px;

font-weight:700;

}

.small{

margin-top:3px;

font-size:8px;

font-weight:700;

text-transform:uppercase;

}

/* ================= SIGNAL ================= */

.signal{

width:9px;
height:9px;

border-radius:50%;

position:absolute;

top:5px;
right:5px;

}

.online{
background:#2f7d32;
}

.offline{
background:#8f2f2f;
}

/* ================= SIDE ================= */

.side{

display:flex;

flex-direction:column;

gap:16px;

}

/* ================= PANEL ================= */

.panel{

background:var(--panel);

border:
1px solid var(--border);

padding:14px;

}

.panel-title{

font-size:13px;

font-weight:700;

margin-bottom:12px;

}

/* ================= LIST ================= */

.list{

display:flex;

flex-direction:column;

gap:8px;

}

/* ================= ITEM ================= */

.item{

background:#dde4ea;

border:
1px solid #a8b2bd;

padding:10px;

}

.item strong{

font-size:12px;

}

.item span{

display:block;

margin-top:4px;

font-size:11px;

color:var(--muted);

}

/* ================= TEXTAREA ================= */

textarea.msg{

width:100%;

height:100px;

border:
1px solid #8f9aa5;

background:#f8fafb;

padding:10px;

resize:none;

outline:none;

}

/* ================= BUTTON ================= */

button{

width:100%;

height:40px;

border:none;

margin-top:12px;

background:#5e6c79;

color:white;

font-weight:700;

cursor:pointer;

}

button:hover{

background:#4d5a66;

}

/* ================= MESSAGE BOX ================= */

.message-box{

margin-top:12px;

background:#dde4ea;

border:
1px solid #a8b2bd;

padding:10px;

font-size:12px;

line-height:1.5;

}

/* ================= MODAL ================= */

.modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.35);

display:none;

justify-content:center;
align-items:center;

z-index:9999;

}

.modal-content{

width:100%;

max-width:420px;

background:#eef2f5;

padding:20px;

border:
1px solid #9eaab5;

}

.modal-title{

font-size:20px;

font-weight:700;

margin-bottom:16px;

}

/* ================= FORM ================= */

label{

display:block;

margin-top:10px;

font-size:11px;

color:var(--muted);

}

input,
select,
textarea{

width:100%;

margin-top:6px;

border:
1px solid #8f9aa5;

background:#f8fafb;

padding:10px;

outline:none;

}

.close{

background:#b7c0c9;

color:#1f2933;

}

/* =========================================
   TABLET
========================================= */

@media (max-width: 1100px){

  .dashboard{

    grid-template-columns: 1fr;

  }

  .side{

    width:100%;

  }

  .grid{

    grid-template-columns:
    repeat(6,minmax(70px,1fr));

  }

}

/* =========================================
   TABLET PEQUEÑA / MOBILE
========================================= */

@media (max-width: 768px){

  .header{

    flex-direction:column;

    align-items:flex-start;

    gap:12px;

  }

  .right{

    width:100%;

    flex-wrap:wrap;

  }

  .search,
  .filter{

    flex:1;

    min-width:140px;

  }

  .clock{

    width:100%;

  }

  .kpis{

    grid-template-columns:
    repeat(2,1fr);

  }

  .dashboard{

    padding:0 10px 10px;

  }

  .yard{

    padding:10px;

  }

  .row{

    flex-direction:column;

    gap:8px;

  }

  .zona{

    width:100%;

    padding-top:0;

  }

  .grid{

    grid-template-columns:
    repeat(4,minmax(65px,1fr));

    gap:6px;

  }

  .card{

    height:64px;

  }

  .code{

    font-size:14px;

  }

  .small{

    font-size:7px;

  }

  .panel{

    padding:10px;

  }

  .modal-content{

    width:95%;

    max-width:none;

  }

}

/* =========================================
   CELULARES
========================================= */

@media (max-width: 480px){

  .title{

    font-size:16px;

  }

  .kpis{

    grid-template-columns:1fr;

  }

  .grid{

    grid-template-columns:
    repeat(3,minmax(60px,1fr));

  }

  .card{

    height:58px;

  }

  .code{

    font-size:13px;

  }

  .small{

    display:none;

  }

  .zona{

    font-size:11px;

  }

}
</style>

</head>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://gogalvnmpntvjtiunowz.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvZ2Fsdm5tcG50dmp0aXVub3d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNzM5MzcsImV4cCI6MjA4Nzg0OTkzN30.wOZbM_s2F-FjdrXqUz6lvRnOYAPuTYlGhwcP3hzbYTw';

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* ================= VARIABLES ================= */

let equipos=[];

let actual=null;

let filtroTexto='';

let filtroEstado='todos';

/* ================= CLOCK ================= */

function reloj(){

document.getElementById('clock')
.innerText =
new Date().toLocaleString();

}

setInterval(reloj,1000);

reloj();

/* ================= LAYOUT COMPLETO ================= */

const layout=[

{
zona:'A',
gruas:[
'N59','N57','N55','K23','K19','K12','','','','',''
]
},

{
zona:'B',
gruas:[
'Z32','Z28','N58','Z44','Z43','Z42','N53','N54','K22','',''
]
},

{
zona:'C',
gruas:[
'Z26','Z45','Z46','Z29','Z50','K35','Z25','Z47','','',''
]
},

{
zona:'D',
gruas:[
'K09','K10','K20','Z52','Z51','Z48','K36','N56','','',''
]
},

{
zona:'E',
gruas:[
'K15','Z30','K33','Z27','Z31','Z49','K24','K21','','',''
]
},

{
zona:'F',
gruas:[
'K11','K16','K34','Z40','Z41','Z39','','K08','K07','K06','K05'
]
}

];
//Especificacion de cada color 

/* ================= GET ================= */

function getEquipo(id){

return equipos.find(
e=>e.id===id
);

}

/* ================= CARGAR ================= */

async function cargar(){

const {data,error} =
await db
.from('gruas')
.select('*');

console.log(data);
console.log(error);

if(error){

alert(error.message);

return;

}

equipos=data || [];

render();

renderKPIs();

renderFallas();

renderPrioridad();

}

/* ================= BUSCAR ================= */

function buscar(v){

filtroTexto=
v.toLowerCase();

render();

}

/* ================= FILTRAR ================= */

function filtrar(v){

filtroEstado=v;

render();

}

/* ================= RENDER ================= */

function render(){

let html='';

layout.forEach(row=>{

html+=`

<div class="row">

<div class="zona">
ZONA ${row.zona}
</div>

<div class="grid">

`;

row.gruas.forEach(id=>{

let g=getEquipo(id);

if(!g){

html+=`
<div class="card empty"></div>
`;

return;

}

if(
!g.id.toLowerCase()
.includes(filtroTexto)
){

html+=`
<div class="card empty"></div>
`;

return;

}

if(
filtroEstado!=='todos' &&
g.estado!==filtroEstado
){

html+=`
<div class="card empty"></div>
`;

return;

}

html+=`

<div
class="card ${g.estado}"
onclick="abrir('${g.id}')"
>

<div class="signal
${g.online ? 'online':'offline'}">
</div>

<div class="code">
${g.id}
</div>

<div class="small">
${g.nombre || ''}
</div>

</div>

`;

});

html+=`
</div>
</div>
`;

});

document.getElementById('yard')
.innerHTML=html;

}

/* ================= KPIS ================= */

function renderKPIs(){

document.getElementById('k1')
.innerText=
equipos.filter(
g=>g.estado==='operacion'
).length;

document.getElementById('k2')
.innerText=
equipos.filter(
g=>
g.estado==='banio' ||
g.estado==='anclada'
).length;

document.getElementById('k3')
.innerText=
equipos.filter(
g=>g.estado==='falla'
).length;

document.getElementById('k4')
.innerText=
equipos.filter(
g=>parseInt(g.prioridad)>0
).length;

}

/* ================= FALLAS ================= */

function renderFallas(){

let html='';

equipos
.filter(g=>g.estado==='falla')
.forEach(g=>{

html+=`

<div class="item">

<strong>
${g.id}
</strong>

<span>
${g.detalle || 'Sin detalle'}
</span>

<span>
Tiempo de entrega:
${g.eta || 'Sin tiempo estimado'}
</span>

</div>

`;

});

document.getElementById('listaFallas')
.innerHTML=
html || 'Sin fallas';

}

/* ================= PRIORIDAD ================= */

/* ================= PRIORIDAD OPERATIVA ================= */

function renderPrioridad(){

let html='';

/*
SOLO MOSTRAR:

- prioridad > 0
- NO disponibles
- NO operación normal
- SI falla / mantto / fuera servicio / sin señal
*/

equipos

.filter(g=>

parseInt(g.prioridad) > 0 &&

g.estado !== 'disponible' &&

g.estado !== 'operacion'

)

.sort((a,b)=>

parseInt(a.prioridad) -
parseInt(b.prioridad)

)

.forEach(g=>{

html+=`

<div class="item">

<strong>
${g.id}
</strong>

<span>
Estado:
${g.estado}
</span>

<span>
Prioridad:
${g.prioridad}
</span>

<span>
${g.detalle || ''}
</span>

</div>

`;

});

document.getElementById('listaPrioridad')
.innerHTML =

html ||

'Sin prioridades operativas';

}
/* ================= MODAL ================= */

function abrir(id){

actual=id;

let g=getEquipo(id);

document.getElementById('modal')
.style.display='flex';

document.getElementById('modalTitle')
.innerText=id;

document.getElementById('estado')
.value=g.estado || 'disponible';

document.getElementById('detalle')
.value=g.detalle || '';

document.getElementById('eta')
.value=g.eta || '';

document.getElementById('prioridad')
.value=g.prioridad || 0;

}

function cerrarModal(){

document.getElementById('modal')
.style.display='none';

}

/* ================= GUARDAR ================= */

/* ================= GUARDAR ================= */

async function guardar(){

const estado =
document.getElementById('estado').value;

const detalle =
document.getElementById('detalle').value;

const eta =
document.getElementById('eta').value;

let prioridad =
parseInt(
document.getElementById('prioridad').value
);

/*
SI CAMBIA A:

- disponible
- operacion

QUITAR PRIORIDAD AUTOMÁTICAMENTE
*/

if(
estado === 'disponible' ||
estado === 'operacion'
){

prioridad = 0;

}

const {error} =
await db

.from('gruas')

.update({

estado,
detalle,
eta,
prioridad,

updated_at:
new Date().toISOString()

})

.eq('id',actual);

if(error){

alert(error.message);

console.log(error);

return;

}

cerrarModal();

cargar();

}

/* ================= MENSAJES ================= */

async function guardarMensaje(){

let mensaje =
document.getElementById('mensajeInput')
.value.trim();

if(!mensaje){

alert('Escribe un mensaje');

return;

}

const {error} =
await db

.from('mensajes_operativos')

.insert([
{
mensaje:mensaje
}
]);

if(error){

alert(error.message);

console.log(error);

return;

}

document.getElementById('mensajeInput')
.value='';

cargarMensajeActual();

cargarHistorial();

}

/* ================= MENSAJE ACTUAL ================= */

async function cargarMensajeActual(){

const {data,error} =
await db

.from('mensajes_operativos')

.select('*')

.order('created_at',{
ascending:false
})

.limit(1);

if(error){

console.log(error);

return;

}

if(!data || !data.length){

document.getElementById('mensajeActual')
.innerHTML=
'Sin mensajes operativos.';

return;

}

let m=data[0];

document.getElementById('mensajeActual')
.innerHTML=`

<strong>

${new Date(m.created_at)
.toLocaleString()}

</strong>

<br><br>

${m.mensaje}

`;

}

/* ================= HISTORIAL ================= */

async function cargarHistorial(){

const {data,error} =
await db

.from('mensajes_operativos')

.select('*')

.order('created_at',{
ascending:false
});

if(error){

console.log(error);

return;

}

let html='';

data.forEach(m=>{

html+=`

<div class="item">

<strong>

${new Date(m.created_at)
.toLocaleString()}

</strong>

<span>

${m.mensaje}

</span>

</div>

`;

});

document.getElementById('historialMensajes')
.innerHTML=
html || 'Sin historial';

}

/* ================= TOGGLE ================= */

function toggleHistorial(){

let h =
document.getElementById(
'historialMensajes'
);

if(h.style.display==='none'){

h.style.display='flex';

}else{

h.style.display='none';

}

}

/* ================= REALTIME ================= */

db
.channel('gruas-changes')
.on(
  'postgres_changes',
  {
    event: '*',
    schema: 'public',
    table: 'gruas'
  },
  (payload) => {

    console.log('CHANGE:', payload);

    cargar(); // temporalmente mantenlo así para confirmar

  }
)
.subscribe((status) => {
  console.log('Realtime status:', status);
});

/* ================= INIT ================= */

cargar();

cargarMensajeActual();

cargarHistorial();

</script>
