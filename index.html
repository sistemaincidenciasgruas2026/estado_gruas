<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL OPERATIVO GRÚAS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ================= PALETA ================= */

:root{

    --bg:#cfd6dd;

    --panel:#edf1f4;

    --border:#aab4bf;

    --text:#1f2933;

    --muted:#596673;

    --green-bg:#7f9d73;
    --green-text:#13210f;

    --blue-bg:#6e8397;
    --blue-text:#0f1b26;

    --red-bg:#9b6d6d;
    --red-text:#2d0e0e;

    --yellow-bg:#9f8f63;
    --yellow-text:#2f2610;

    --gray-bg:#7f8a95;
    --gray-text:#111827;

    --purple-bg:#80718f;
    --purple-text:#1d1328;
}

/* ================= BODY ================= */

body{

    background:var(--bg);

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:var(--text);

    min-height:100vh;
}

/* ================= HEADER ================= */

.header{

    background:#b8c2cc;

    border-bottom:
    2px solid #8d98a3;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:14px 18px;

    position:sticky;
    top:0;

    z-index:1000;
}

.title{

    font-size:20px;
    font-weight:700;

    letter-spacing:1px;
}

.right{

    display:flex;
    align-items:center;
    gap:10px;
}

.search,
.filter{

    height:38px;

    border:
    1px solid #8f9aa5;

    background:#eef1f4;

    padding:0 10px;

    font-size:12px;

    outline:none;
}

.clock{

    font-size:12px;
    font-weight:700;
}

/* ================= KPI ================= */

.kpis{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:12px;

    padding:16px;
}

.kpi{

    background:var(--panel);

    border:
    1px solid var(--border);

    padding:14px;
}

.kpi-title{

    font-size:11px;

    color:var(--muted);
}

.kpi-value{

    margin-top:8px;

    font-size:28px;
    font-weight:700;
}

/* ================= DASHBOARD ================= */

.dashboard{

    display:grid;

    grid-template-columns:
    1fr 340px;

    gap:16px;

    padding:0 16px 16px;
}

/* ================= YARD ================= */

.yard{

    background:var(--panel);

    border:
    1px solid var(--border);

    padding:14px;

    overflow:auto;
}

.row{

    display:flex;

    align-items:flex-start;

    margin-bottom:16px;
}

.zona{

    width:90px;

    padding-top:18px;

    font-size:12px;
    font-weight:700;

    color:var(--muted);
}

/* ================= GRID ================= */

.grid{

    display:grid;

    grid-template-columns:
    repeat(11,minmax(70px,1fr));

    gap:8px;

    width:100%;
}

/* ================= CARD ================= */

.card{

    width:100%;

    min-width:70px;

    height:72px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    position:relative;

    cursor:pointer;

    border:
    1px solid rgba(0,0,0,.25);
}

.card:hover{

    filter:brightness(.96);
}

/* ================= ESTADOS ================= */

.operacion{
    background:var(--green-bg);
    color:var(--green-text);
}

.disponible{
    background:var(--blue-bg);
    color:var(--blue-text);
}

.falla{
    background:var(--red-bg);
    color:var(--red-text);
}

.banio{
    background:var(--yellow-bg);
    color:var(--yellow-text);
}

.anclada{
    background:var(--gray-bg);
    color:var(--gray-text);
}

.sinsenal{
    background:var(--purple-bg);
    color:var(--purple-text);
}

.empty{

    background:#d9e0e6;

    border:
    1px dashed #9aa6b2;
}

/* ================= CARD TEXT ================= */

.code{

    font-size:16px;
    font-weight:700;
}

.small{

    margin-top:3px;

    font-size:8px;
    font-weight:700;

    text-transform:uppercase;
}

.badge-priority{

    position:absolute;

    bottom:4px;
    right:4px;

    background:#1f2933;

    color:white;

    font-size:8px;

    padding:1px 4px;
}

/* ================= SIGNAL ================= */

.signal{

    width:9px;
    height:9px;

    border-radius:50%;

    position:absolute;

    top:5px;
    right:5px;
}

.online{
    background:#2f7d32;
}

.offline{
    background:#8f2f2f;
}

/* ================= SIDE ================= */

.side{

    display:flex;
    flex-direction:column;
    gap:16px;
}

/* ================= PANEL ================= */

.panel{

    background:var(--panel);

    border:
    1px solid var(--border);

    padding:14px;
}

.panel-title{

    font-size:13px;
    font-weight:700;

    margin-bottom:12px;
}

.list{

    display:flex;
    flex-direction:column;
    gap:8px;
}

/* ================= ITEM ================= */

.item{

    background:#dde4ea;

    border:
    1px solid #a8b2bd;

    padding:10px;
}

.item strong{

    font-size:12px;
}

.item span{

    display:block;

    margin-top:4px;

    font-size:11px;

    color:var(--muted);
}

/* ================= MENSAJES ================= */

textarea.msg{

    width:100%;
    height:100px;

    border:
    1px solid #8f9aa5;

    background:#f8fafb;

    padding:10px;

    resize:none;

    outline:none;
}

/* ================= BUTTON ================= */

button{

    width:100%;

    height:40px;

    border:none;

    margin-top:12px;

    background:#5e6c79;

    color:white;

    font-weight:700;

    cursor:pointer;
}

button:hover{

    background:#4d5a66;
}

/* ================= MESSAGE ================= */

.message-box{

    margin-top:12px;

    background:#dde4ea;

    border:
    1px solid #a8b2bd;

    padding:10px;

    font-size:12px;

    line-height:1.5;
}

/* ================= MODAL ================= */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.35);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.modal-content{

    width:100%;
    max-width:420px;

    background:#eef2f5;

    padding:20px;

    border:
    1px solid #9eaab5;
}

.modal-title{

    font-size:20px;
    font-weight:700;

    margin-bottom:16px;
}

/* ================= FORM ================= */

label{

    display:block;

    margin-top:10px;

    font-size:11px;

    color:var(--muted);
}

input,
select,
textarea{

    width:100%;

    margin-top:6px;

    border:
    1px solid #8f9aa5;

    background:#f8fafb;

    padding:10px;

    outline:none;
}

.close{

    background:#b7c0c9;

    color:#1f2933;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1400px){

.grid{

    grid-template-columns:
    repeat(8,minmax(70px,1fr));
}

}

@media(max-width:1100px){

.dashboard{

    grid-template-columns:1fr;
}

.side{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:12px;
}

.grid{

    grid-template-columns:
    repeat(6,minmax(70px,1fr));
}

}

@media(max-width:800px){

.header{

    flex-direction:column;

    align-items:flex-start;

    gap:10px;
}

.right{

    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;
}

.clock{

    grid-column:1/-1;
}

.kpis{

    grid-template-columns:
    repeat(2,1fr);
}

.grid{

    grid-template-columns:
    repeat(4,minmax(65px,1fr));
}

.row{

    flex-direction:column;
}

.zona{

    width:100%;

    padding-top:0;
}

}

@media(max-width:560px){

.right{

    grid-template-columns:1fr;
}

.kpis{

    grid-template-columns:1fr;
}

.dashboard{

    padding:0 10px 10px;
}

.grid{

    grid-template-columns:
    repeat(3,minmax(70px,1fr));
}

.modal{

    padding:10px;
}

.modal-content{

    max-width:100%;
}

}

@media(max-width:380px){

.grid{

    grid-template-columns:
    repeat(2,minmax(70px,1fr));
}

.small{

    display:none;
}

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

<div class="title">
CONTROL OPERATIVO GRÚAS
</div>

<div class="right">

<input
type="text"
class="search"
placeholder="Buscar grúa..."
onkeyup="buscar(this.value)"
>

<select
class="filter"
onchange="filtrar(this.value)"
>

<option value="todos">TODOS</option>
<option value="operacion">OPERACIÓN</option>
<option value="disponible">DISPONIBLE</option>
<option value="falla">FALLA</option>
<option value="banio">MANTTO</option>
<option value="anclada">FUERA SERVICIO</option>
<option value="sinsenal">SIN SEÑAL</option>

</select>

<div class="clock" id="clock"></div>

</div>

</div>

<!-- ================= KPIS ================= -->

<div class="kpis">

<div class="kpi">
<div class="kpi-title">GRÚAS TRABAJANDO</div>
<div class="kpi-value" id="k1">0</div>
</div>

<div class="kpi">
<div class="kpi-title">MANTTO / F.S.</div>
<div class="kpi-value" id="k2">0</div>
</div>

<div class="kpi">
<div class="kpi-title">FALLAS ACTIVAS</div>
<div class="kpi-value" id="k3">0</div>
</div>

<div class="kpi">
<div class="kpi-title">GRÚAS PRIORIDAD</div>
<div class="kpi-value" id="k4">0</div>
</div>

</div>

<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

<div class="yard" id="yard"></div>

<div class="side">

<div class="panel">

<div class="panel-title">
GRÚAS EN FALLA / ETA
</div>

<div class="list" id="listaFallas"></div>

</div>

<div class="panel">

<div class="panel-title">
PRIORIDAD OPERATIVA
</div>

<div class="list" id="listaPrioridad"></div>

</div>

<div class="panel">

<div class="panel-title">
MENSAJES OPERATIVOS
</div>

<textarea
class="msg"
id="mensajeInput"
placeholder="Escribe mensaje operativo..."
></textarea>

<button onclick="guardarMensaje()">
PUBLICAR MENSAJE
</button>

<div
class="message-box"
id="mensajeActual"
>

Sin mensajes operativos.

</div>

</div>

</div>

</div>

<!-- ================= MODAL ================= -->

<div class="modal" id="modal">

<div class="modal-content">

<div class="modal-title" id="modalTitle"></div>

<label>Estado</label>

<select id="estado">

<option value="operacion">Operación</option>
<option value="disponible">Disponible</option>
<option value="falla">Falla</option>
<option value="banio">Mantenimiento</option>
<option value="anclada">Fuera servicio</option>
<option value="sinsenal">Sin señal</option>

</select>

<label>Detalle</label>

<textarea id="detalle"></textarea>

<label>ETA devolución Ops</label>

<input type="datetime-local" id="eta">

<label>Prioridad Operativa</label>

<select id="prioridad">

<option value="0">SIN PRIORIDAD</option>
<option value="1">PRIORIDAD 1 - CRÍTICA</option>
<option value="2">PRIORIDAD 2 - ALTA</option>
<option value="3">PRIORIDAD 3 - MEDIA</option>
<option value="4">PRIORIDAD 4 - BAJA</option>

</select>

<button onclick="guardar()">
GUARDAR
</button>

<button
class="close"
onclick="cerrarModal()"
>
CERRAR
</button>

</div>

</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://gogalvnmpntvjtiunowz.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvZ2Fsdm5tcG50dmp0aXVub3d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNzM5MzcsImV4cCI6MjA4Nzg0OTkzN30.wOZbM_s2F-FjdrXqUz6lvRnOYAPuTYlGhwcP3hzbYTw';

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* ================= LAYOUT ================= */

const layout=[

{
zona:'A',
gruas:[
'N59','N57','N55','K23','K19','K12','','','','',''
]
},

{
zona:'B',
gruas:[
'Z32','Z28','N58','Z44','Z43','Z42','N53','N54','K22','',''
]
},

{
zona:'C',
gruas:[
'Z26','Z45','Z46','Z29','Z50','K35','Z25','Z47','','',''
]
},

{
zona:'D',
gruas:[
'K09','K10','K20','Z52','Z51','Z48','K36','N56','','',''
]
},

{
zona:'E',
gruas:[
'K15','Z30','K33','Z27','Z31','Z49','K24','K21','','',''
]
},

{
zona:'F',
gruas:[
'K11','K16','K34','Z40','Z41','Z39','','K08','K07','K06','K05'
]
}

];

/* ================= VARIABLES ================= */

let equipos=[];
let actual=null;

let filtroTexto='';
let filtroEstado='todos';

/* ================= CLOCK ================= */

function reloj(){

document.getElementById('clock')
.innerText =
new Date().toLocaleString();

}

setInterval(reloj,1000);

reloj();

/* ================= GET ================= */

function getEquipo(id){

return equipos.find(
e=>e.id===id
);

}

/* ================= LOAD ================= */

async function cargar(){

const {data,error} =
await db
.from('gruas')
.select('*');

if(error){

console.log(error);

alert(
'Error Supabase: ' +
error.message
);

return;

}

equipos=data;

equipos.sort(
(a,b)=>
(a.prioridad || 99) -
(b.prioridad || 99)
);

render();

}

cargar();

cargarMensaje();

/* ================= FILTER ================= */

function buscar(v){

filtroTexto=
v.toLowerCase();

render();

}

function filtrar(v){

filtroEstado=v;

render();

}

/* ================= RENDER ================= */

function render(){

let html='';

let trabajando=0;
let mantto=0;
let fallas=0;
let prioridad=0;

let htmlFallas='';
let htmlPrioridad='';

layout.forEach(row=>{

html+=`

<div class="row">

<div class="zona">
ZONA ${row.zona}
</div>

<div class="grid">

`;

row.gruas.forEach(id=>{

if(id===''){

html+=`
<div class="card empty"></div>
`;

return;

}

let g=getEquipo(id);

if(!g){

html+=`
<div class="card empty"></div>
`;

return;

}

if(
!g.id.toLowerCase()
.includes(filtroTexto)
){

html+=`
<div class="card empty"></div>
`;

return;

}

if(
filtroEstado!=='todos' &&
g.estado!==filtroEstado
){

html+=`
<div class="card empty"></div>
`;

return;

}

if(g.estado==='operacion')
trabajando++;

if(
g.estado==='banio' ||
g.estado==='anclada'
)
mantto++;

if(g.estado==='falla')
fallas++;

if(g.prioridad > 0)
prioridad++;

if(g.estado==='falla'){

htmlFallas+=`

<div class="item">

<strong>${g.id}</strong>

<span>
${g.detalle || 'Sin detalle'}
</span>

<span>
ETA:
${g.eta || 'Sin tiempo'}
</span>

</div>

`;

}

if(g.prioridad > 0){

let texto='';

if(g.prioridad===1)
texto='CRÍTICA';

if(g.prioridad===2)
texto='ALTA';

if(g.prioridad===3)
texto='MEDIA';

if(g.prioridad===4)
texto='BAJA';

htmlPrioridad+=`

<div class="item">

<strong>${g.id}</strong>

<span>
PRIORIDAD ${g.prioridad}
</span>

<span>
${texto}
</span>

</div>

`;

}

html+=`

<div
class="card ${g.estado}"
onclick="abrir('${g.id}')"
>

<div class="signal
${g.online ? 'online':'offline'}">
</div>

<div class="code">
${g.id}
</div>

<div class="small">
${g.estado}
</div>

${g.prioridad > 0
? `<div class="badge-priority">P${g.prioridad}</div>`
: ''
}

</div>

`;

});

html+=`
</div>
</div>
`;

});

document.getElementById('yard')
.innerHTML=html;

document.getElementById('k1')
.innerText=trabajando;

document.getElementById('k2')
.innerText=mantto;

document.getElementById('k3')
.innerText=fallas;

document.getElementById('k4')
.innerText=prioridad;

document.getElementById('listaFallas')
.innerHTML=
htmlFallas ||
'<div class="item">Sin fallas</div>';

document.getElementById('listaPrioridad')
.innerHTML=
htmlPrioridad ||
'<div class="item">Sin prioridades</div>';

}

/* ================= MODAL ================= */

function abrir(id){

actual=id;

let g=getEquipo(id);

document.getElementById('modal')
.style.display='flex';

document.getElementById('modalTitle')
.innerText=id;

document.getElementById('estado')
.value=g.estado;

document.getElementById('detalle')
.value=g.detalle || '';

document.getElementById('eta')
.value=g.eta || '';

document.getElementById('prioridad')
.value =
g.prioridad || 0;

}

function cerrarModal(){

document.getElementById('modal')
.style.display='none';

}

/* ================= SAVE ================= */

async function guardar(){

let estado =
document.getElementById('estado').value;

let detalle =
document.getElementById('detalle').value;

let eta =
document.getElementById('eta').value;

let prioridad =
parseInt(
document.getElementById('prioridad').value
);

const {error} =
await db

.from('gruas')

.update({

estado:estado,
detalle:detalle,
eta:eta,
prioridad:prioridad,
updated_at:
new Date().toISOString()

})

.eq('id',actual);

if(error){

alert(error.message);

console.log(error);

return;

}

cerrarModal();

cargar();

}

/* ================= MENSAJES ================= */

async function guardarMensaje(){

let texto =
document.getElementById('mensajeInput').value;

if(!texto) return;

const {error} =
await db

.from('mensajes_operativos')

.insert([{

mensaje:texto

}]);

if(error){

alert(error.message);

return;

}

document.getElementById('mensajeInput')
.value='';

cargarMensaje();

}

/* ================= CARGAR MENSAJE ================= */

async function cargarMensaje(){

const {data,error} =
await db

.from('mensajes_operativos')

.select('*')

.order('created_at',{
ascending:false
})

.limit(1);

if(error){

console.log(error);

return;

}

if(!data.length){

document.getElementById('mensajeActual')
.innerHTML =
'Sin mensajes operativos.';

return;

}

let m = data[0];

document.getElementById('mensajeActual')
.innerHTML =

`
<strong>
${new Date(m.created_at)
.toLocaleString()}
</strong>

<br><br>

${m.mensaje}
`;

}

</script>

</body>
</html>
